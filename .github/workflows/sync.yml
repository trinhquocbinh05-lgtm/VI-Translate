name: Sync Fork

on:
  schedule:
    - cron: "0 0 * * *" # Chạy tự động mỗi ngày lúc 00:00 UTC (7:00 sáng VN)
  workflow_dispatch: # Cho phép bấm nút 'Run workflow' thủ công bất cứ lúc nào

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Syncing fork with upstream..."
          gh repo sync ${{ github.repository }} -b main || {
            echo "API sync encountered an issue, trying git merge fallback..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git remote add upstream https://github.com/breslee1707/VI-Translate.git || true
            git fetch upstream main
            git checkout main
            git merge upstream/main -m "chore: auto-sync upstream" || (git merge --abort && exit 0)
            git push origin main || echo "Nothing to push or permission pending"
          }

